[workspace]
channels = ["conda-forge"]
name = "nrp-jupyterhub-debug"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.start]
depends-on = ["lab"]

[dependencies]
python = ">=3.13.14,<3.14"
awkward = ">=2.11.0,<3"
hist = ">=2.10.1,<3"
mplhep = ">=1.3.1,<2"
coffea = ">=2026.7.0,<2027"
cabinetry = ">=0.6.0,<0.7"
particle = ">=1.0.0,<2"
jupyter-server-proxy = ">=4.5.0,<5"
jupyter-server-mcp = ">=0.2.1,<0.3"
jupyter-ai-tools = ">=0.6.1,<0.7"
jupyterlab-commands-toolkit = ">=0.1.6,<0.2"
marimo = ">=0.23.15,<0.24"

[feature.lab.dependencies]
notebook = ">=7.6.1,<8"
jupyterlab = ">=4.6.2,<5"

[feature.lab.tasks.lab]
cmd = "jupyter lab"

[environments]
lab = ["lab"]

[pypi-dependencies]
marimo-jupyter-extension = ">=0.3.0, <0.4"
