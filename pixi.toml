[workspace]
channels = ["conda-forge"]
name = "nrp-jupyterhub-debug"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks.start]
depends-on = ["lab"]

[dependencies]
python = ">=3.14.6,<3.15"
awkward = ">=2.11.0,<3"
hist = ">=2.10.1,<3"
matplotlib = ">=3.11.1,<4"
mplhep = ">=1.3.1,<2"

[feature.lab.dependencies]
notebook = ">=7.6.1,<8"
jupyterlab = ">=4.6.2,<5"

[feature.lab.tasks.lab]
cmd = "jupyter lab"

[environments]
lab = ["lab"]
